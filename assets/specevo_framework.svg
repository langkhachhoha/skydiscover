<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1240 848" width="1240" height="848" font-family="'Helvetica Neue','Segoe UI',system-ui,-apple-system,Roboto,Arial,sans-serif">
  <defs>
    <linearGradient id="gauge" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#3E8E5A"/>
      <stop offset="0.5" stop-color="#D89A2C"/>
      <stop offset="1" stop-color="#B0472E"/>
    </linearGradient>
    <linearGradient id="costaxis" x1="0" y1="1" x2="0" y2="0">
      <stop offset="0" stop-color="#0E7C86"/>
      <stop offset="1" stop-color="#B0472E"/>
    </linearGradient>
    <marker id="aSlate" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#3E4C59"/></marker>
    <marker id="aTeal" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#0E7C86"/></marker>
    <marker id="aBrick" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7.5" markerHeight="7.5" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#B0472E"/></marker>
    <marker id="aIndigo" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#4B3F8F"/></marker>
    <style>
      text{fill:#15202B}
      .eyebrow{font-size:10px;font-weight:700;letter-spacing:.13em;fill:#5C6B7A}
      .ttl{font-size:30px;font-weight:700;letter-spacing:-.01em}
      .sub{font-size:14px;fill:#5C6B7A}
      .hd{font-size:15.5px;font-weight:700}
      .role{font-size:11.5px;fill:#5C6B7A}
      .bx{font-size:11.5px;fill:#33424E}
      .sm{font-size:10px;fill:#5C6B7A}
      .mono{font-family:'SF Mono','JetBrains Mono',Menlo,Consolas,'Liberation Mono',monospace;font-size:10.5px;fill:#33424E}
      .monos{font-family:'SF Mono','JetBrains Mono',Menlo,Consolas,'Liberation Mono',monospace;font-size:9.5px;fill:#5C6B7A}
      .tag{font-size:11px;font-weight:700;letter-spacing:.06em}
      .lbl{font-size:9.5px;font-weight:600;fill:#5C6B7A;letter-spacing:.02em}
      .box{stroke-width:1.5;rx:8}
      .spec{fill:#E6F2F2;stroke:#0E7C86}
      .nav{fill:#F8E9E2;stroke:#B0472E}
      .arc{fill:#EDF1F4;stroke:#3E4C59}
      .adv{fill:#EDEAF6;stroke:#4B3F8F}
      .node{fill:#FFFFFF;stroke:#0E7C86;stroke-width:1.2}
      .tSpec{fill:#0B5B62}.tNav{fill:#8A3A26}.tArc{fill:#2E3A45}.tAdv{fill:#3A3072}
      .fThin{fill:none;stroke:#B0472E;stroke-width:1.6}
      .fThick{fill:none;stroke:#0E7C86;stroke-width:2.6}
      .fSlate{fill:none;stroke:#3E4C59;stroke-width:1.8}
      .fDash{fill:none;stroke:#4B3F8F;stroke-width:1.8;stroke-dasharray:6 4}
    </style>
  </defs>

  <rect x="0" y="0" width="1240" height="848" fill="#FBFCFD"/>

  <!-- ============ TITLE ============ -->
  <text x="52" y="34" class="eyebrow">FIG. 1 · METHOD ARCHITECTURE</text>
  <text x="52" y="64" class="ttl">SpecEvo<tspan font-weight="400" fill="#5C6B7A">: Speculative Scientific Discovery</tspan></text>
  <text x="52" y="88" class="sub">Speculate&#8209;then&#8209;Escalate — a cheap model proposes most steps; the frontier model is summoned only when the search stalls.</text>

  <!-- ============ COST AXIS ============ -->
  <line x1="34" y1="806" x2="34" y2="118" stroke="url(#costaxis)" stroke-width="3" marker-end="url(#aBrick)"/>
  <text x="22" y="462" class="lbl" transform="rotate(-90 22 462)" text-anchor="middle">COST / STEP   cheap · frequent  →  expensive · rare</text>

  <!-- ============ INIT PHASE (left column) ============ -->
  <text x="52" y="126" class="eyebrow">INIT PHASE</text>
  <rect class="box arc" x="52" y="134" width="168" height="46"/>
  <text x="64" y="156" class="hd tArc" font-size="13">Problem config</text>
  <text x="64" y="172" class="mono">description · signature · score_fn</text>

  <rect class="box nav" x="52" y="196" width="168" height="58"/>
  <text x="64" y="216" class="tag tNav">① Diverse seeds × 5</text>
  <text x="64" y="232" class="bx">frontier · sequential</text>
  <text x="64" y="247" class="bx">each shown prior seeds → fresh paradigms</text>

  <rect class="box spec" x="52" y="270" width="168" height="58"/>
  <text x="64" y="290" class="tag tSpec">② Variants × 20 / seed</text>
  <text x="64" y="306" class="bx">small model · parallel</text>
  <text x="64" y="321" class="bx">≈ 105 seeded candidates</text>

  <path class="fSlate" d="M220 300 C 248 316, 250 520, 272 552" marker-end="url(#aSlate)"/>
  <text x="232" y="372" class="lbl" transform="rotate(78 232 372)">seed population</text>

  <!-- ============ NAVIGATOR (top tier) ============ -->
  <text x="272" y="126" class="eyebrow" fill="#8A3A26">ESCALATE — EXPENSIVE · RARE</text>
  <rect class="box nav" x="272" y="134" width="728" height="148"/>
  <text x="286" y="160" class="hd tNav">NAVIGATOR</text>
  <text x="392" y="160" class="role">· frontier model · fires every 50 evals · 1 call/trigger</text>
  <text x="286" y="180" class="bx">Reads cell representatives (full code) + other&#8209;cell descriptions; picks a move&#8209;class by stagnation.</text>

  <!-- mode chips -->
  <g>
    <rect class="box" fill="#FFFFFF" stroke="#3E8E5A" stroke-width="1.2" x="288" y="192" width="228" height="78"/>
    <rect x="288" y="192" width="228" height="4" fill="#3E8E5A" rx="2"/>
    <text x="300" y="216" class="tag" fill="#2F6E45">SYNTHESIS</text>
    <text x="504" y="216" class="mono" text-anchor="end">s ≤ 0.4</text>
    <text x="300" y="235" class="bx">3 anchors → fuse close</text>
    <text x="300" y="250" class="bx">contenders into one</text>
    <text x="300" y="263" class="monos">MOVE: SYNTHESIS</text>
  </g>
  <g>
    <rect class="box" fill="#FFFFFF" stroke="#D89A2C" stroke-width="1.2" x="522" y="192" width="228" height="78"/>
    <rect x="522" y="192" width="228" height="4" fill="#D89A2C" rx="2"/>
    <text x="534" y="216" class="tag" fill="#A4721E">SURGICAL</text>
    <text x="738" y="216" class="mono" text-anchor="end">0.4 &lt; s ≤ 0.7</text>
    <text x="534" y="235" class="bx">1 anchor (champion) →</text>
    <text x="534" y="250" class="bx">one precise local fix</text>
    <text x="534" y="263" class="monos">MOVE: SURGICAL</text>
  </g>
  <g>
    <rect class="box" fill="#FFFFFF" stroke="#B0472E" stroke-width="1.2" x="756" y="192" width="230" height="78"/>
    <rect x="756" y="192" width="230" height="4" fill="#B0472E" rx="2"/>
    <text x="768" y="216" class="tag" fill="#8A3A26">SHIFT</text>
    <text x="974" y="216" class="mono" text-anchor="end">s &gt; 0.7</text>
    <text x="768" y="235" class="bx">2 anchors → a new</text>
    <text x="768" y="250" class="bx">paradigm class (+force-admit)</text>
    <text x="768" y="263" class="monos">MOVE: SHIFT</text>
  </g>

  <!-- ============ STAGNATION GAUGE (spine) ============ -->
  <rect x="440" y="316" width="400" height="13" rx="6.5" fill="url(#gauge)"/>
  <g stroke="#33424E" stroke-width="1">
    <line x1="440" y1="331" x2="440" y2="338"/>
    <line x1="600" y1="331" x2="600" y2="340"/>
    <line x1="720" y1="331" x2="720" y2="340"/>
    <line x1="840" y1="331" x2="840" y2="338"/>
  </g>
  <text x="436" y="312" class="sm" text-anchor="start">0</text>
  <text x="600" y="352" class="monos" text-anchor="middle">0.4</text>
  <text x="720" y="352" class="monos" text-anchor="middle">0.7</text>
  <text x="844" y="312" class="sm" text-anchor="end">1</text>
  <path d="M664 314 l-6 -9 l12 0 z" fill="#15202B"/>
  <text x="640" y="300" class="lbl" text-anchor="middle">STAGNATION GAUGE</text>
  <text x="850" y="326" class="monos">s = max( plateau/100 , admit&#8209;gap/20 )</text>

  <!-- spine arrows: speculator -> gauge -> navigator -->
  <path class="fSlate" d="M636 356 L636 342" marker-end="url(#aSlate)"/>
  <text x="642" y="352" class="lbl">stagnation rises</text>
  <path class="fThin" d="M636 316 L636 284" marker-end="url(#aBrick)"/>
  <text x="642" y="302" class="lbl" fill="#8A3A26">escalate</text>

  <!-- navigator output down the right margin -->
  <path class="fThin" d="M1000 220 L1008 220 L1008 558 L1002 558" marker-end="url(#aBrick)"/>
  <text x="1014" y="392" class="lbl" fill="#8A3A26" transform="rotate(90 1014 392)">1 seed + 4 cheap variants → population</text>

  <!-- ============ SPECULATOR (cheap engine) ============ -->
  <text x="272" y="350" class="eyebrow" fill="#0B5B62">SPECULATE — CHEAP · CONTINUOUS</text>
  <rect class="box spec" x="272" y="356" width="728" height="150"/>
  <text x="286" y="382" class="hd tSpec">SPECULATOR</text>
  <text x="392" y="382" class="role">· small model · ×4 workers · runs until budget</text>
  <text x="286" y="402" class="bx">Floods the search with cheap, many&#8209;directioned proposals — the engine of “normal science.”</text>

  <!-- pipeline nodes -->
  <rect class="box node" x="290" y="416" width="158" height="72"/>
  <text x="300" y="438" class="hd tSpec" font-size="12.5">select parent</text>
  <text x="300" y="456" class="mono">Zipfian rank</text>
  <text x="300" y="471" class="mono">β ← stagnation</text>

  <rect class="box node" x="466" y="416" width="208" height="72"/>
  <text x="476" y="438" class="hd tSpec" font-size="12.5">operators</text>
  <text x="476" y="456" class="mono">mutate ×3 · crossover ×2</text>
  <text x="476" y="471" class="mono">targeted-mutate (analysis)</text>

  <rect class="box node" x="692" y="416" width="130" height="72"/>
  <text x="702" y="438" class="hd tSpec" font-size="12.5">evaluate</text>
  <text x="702" y="456" class="mono">sandboxed</text>
  <text x="702" y="471" class="mono">run → score</text>

  <rect class="box node" x="840" y="416" width="120" height="72"/>
  <text x="850" y="438" class="hd tSpec" font-size="12.5">admit?</text>
  <text x="850" y="456" class="mono">cluster</text>
  <text x="850" y="471" class="mono">decides</text>

  <g class="fThick">
    <path d="M448 452 L463 452" marker-end="url(#aTeal)"/>
    <path d="M674 452 L689 452" marker-end="url(#aTeal)"/>
    <path d="M822 452 L837 452" marker-end="url(#aTeal)"/>
  </g>

  <!-- speculator <-> archive -->
  <path class="fSlate" d="M360 530 L360 490" marker-end="url(#aSlate)"/>
  <text x="366" y="516" class="lbl">parent</text>
  <path class="fThick" d="M900 490 L900 528" marker-end="url(#aTeal)"/>
  <text x="906" y="516" class="lbl" fill="#0B5B62">offspring</text>

  <!-- ============ ARCHIVE (substrate) ============ -->
  <text x="272" y="524" class="eyebrow" fill="#2E3A45">POPULATION — SHARED SUBSTRATE</text>
  <rect class="box arc" x="272" y="530" width="728" height="112"/>
  <text x="286" y="556" class="hd tArc">EMBEDDED POPULATION</text>
  <text x="478" y="556" class="role">· adaptive MAP&#8209;Elites (not CVT)</text>
  <text x="286" y="575" class="mono">program → [ AST 14d | PCA(desc-emb) 8d ] = 22d → KMeans cell · keep best per cell · re-cluster / 30 admits</text>

  <!-- schematic clusters -->
  <g>
    <ellipse cx="340" cy="612" rx="34" ry="20" fill="none" stroke="#9AA7B2" stroke-dasharray="3 3"/>
    <circle cx="330" cy="606" r="3.5" fill="#3E4C59"/><circle cx="350" cy="616" r="2.5" fill="#9AA7B2"/><circle cx="338" cy="620" r="2.5" fill="#9AA7B2"/>
    <ellipse cx="450" cy="612" rx="34" ry="20" fill="none" stroke="#9AA7B2" stroke-dasharray="3 3"/>
    <circle cx="442" cy="608" r="3.5" fill="#0E7C86"/><circle cx="460" cy="618" r="2.5" fill="#9AA7B2"/>
    <ellipse cx="560" cy="612" rx="34" ry="20" fill="none" stroke="#9AA7B2" stroke-dasharray="3 3"/>
    <circle cx="552" cy="610" r="3.5" fill="#3E4C59"/><circle cx="570" cy="606" r="2.5" fill="#9AA7B2"/><circle cx="566" cy="620" r="2.5" fill="#9AA7B2"/>
    <ellipse cx="670" cy="612" rx="34" ry="20" fill="none" stroke="#9AA7B2" stroke-dasharray="3 3"/>
    <circle cx="662" cy="608" r="3.5" fill="#B0472E"/><circle cx="680" cy="616" r="2.5" fill="#9AA7B2"/>
    <ellipse cx="780" cy="612" rx="34" ry="20" fill="none" stroke="#9AA7B2" stroke-dasharray="3 3"/>
    <circle cx="772" cy="610" r="3.5" fill="#3E4C59"/><circle cx="790" cy="608" r="2.5" fill="#9AA7B2"/><circle cx="784" cy="620" r="2.5" fill="#9AA7B2"/>
    <ellipse cx="900" cy="612" rx="40" ry="20" fill="none" stroke="#9AA7B2" stroke-dasharray="3 3"/>
    <circle cx="890" cy="608" r="3.5" fill="#0E7C86"/><circle cx="912" cy="616" r="2.5" fill="#9AA7B2"/><circle cx="902" cy="620" r="2.5" fill="#9AA7B2"/>
  </g>
  <text x="952" y="616" class="sm">● best per cell</text>

  <!-- archive feeds navigator (anchors) -->
  <path class="fThin" d="M286 540 C 246 500, 246 300, 284 250" marker-end="url(#aBrick)"/>
  <text x="250" y="396" class="lbl" fill="#8A3A26" transform="rotate(-90 250 396)">anchors + descriptions</text>

  <!-- ============ ADVISOR (feedback) ============ -->
  <text x="272" y="662" class="eyebrow" fill="#3A3072">REFLECT — LEARNED FEEDBACK PRIOR</text>
  <rect class="box adv" x="272" y="668" width="728" height="150"/>
  <text x="286" y="694" class="hd tAdv">ADVISOR</text>
  <text x="360" y="694" class="role">· every 50 evals · population&#8209;level reflection</text>
  <text x="286" y="713" class="bx">Distills the trajectory into a prior that steers cheap proposals — names what works, what has saturated, what to try.</text>

  <text x="286" y="740" class="lbl">READS</text>
  <g font-size="10">
    <rect x="330" y="730" width="132" height="20" rx="10" fill="#FFFFFF" stroke="#4B3F8F" stroke-width="1"/><text x="396" y="744" text-anchor="middle" class="mono">top-K descriptions</text>
    <rect x="470" y="730" width="156" height="20" rx="10" fill="#FFFFFF" stroke="#4B3F8F" stroke-width="1"/><text x="548" y="744" text-anchor="middle" class="mono">improving vs saturated Δ</text>
    <rect x="634" y="730" width="120" height="20" rx="10" fill="#FFFFFF" stroke="#4B3F8F" stroke-width="1"/><text x="694" y="744" text-anchor="middle" class="mono">error taxonomy ×7</text>
    <rect x="762" y="730" width="96" height="20" rx="10" fill="#FFFFFF" stroke="#4B3F8F" stroke-width="1"/><text x="810" y="744" text-anchor="middle" class="mono">accept-rate</text>
    <rect x="866" y="730" width="96" height="20" rx="10" fill="#FFFFFF" stroke="#4B3F8F" stroke-width="1"/><text x="914" y="744" text-anchor="middle" class="mono">stagnation</text>
  </g>

  <text x="286" y="788" class="lbl">WRITES</text>
  <g font-size="10.5">
    <rect x="334" y="776" width="118" height="22" rx="5" fill="#4B3F8F"/><text x="393" y="791" text-anchor="middle" fill="#FFFFFF" class="tag" font-size="10.5">WORKING</text>
    <rect x="462" y="776" width="124" height="22" rx="5" fill="#4B3F8F"/><text x="524" y="791" text-anchor="middle" fill="#FFFFFF" class="tag" font-size="10.5">SATURATED</text>
    <rect x="596" y="776" width="118" height="22" rx="5" fill="#4B3F8F"/><text x="655" y="791" text-anchor="middle" fill="#FFFFFF" class="tag" font-size="10.5">TRY NEXT</text>
    <rect x="724" y="776" width="104" height="22" rx="5" fill="#4B3F8F"/><text x="776" y="791" text-anchor="middle" fill="#FFFFFF" class="tag" font-size="10.5">AVOID</text>
  </g>

  <!-- archive -> advisor -->
  <path class="fSlate" d="M540 642 L540 666" marker-end="url(#aSlate)"/>
  <text x="546" y="660" class="lbl">signals</text>

  <!-- advisor -> speculator (inject) -->
  <path class="fDash" d="M272 724 L246 724 L246 452 L288 452" marker-end="url(#aIndigo)"/>
  <text x="238" y="590" class="lbl" fill="#3A3072" transform="rotate(-90 238 590)">advice → prompt · inject p = 0.35</text>

  <!-- ============ RIGHT COLUMN ============ -->
  <!-- Strategy Log -->
  <rect class="box nav" x="1018" y="134" width="194" height="120" fill="#FBF1EC"/>
  <text x="1030" y="156" class="hd tNav" font-size="13">Strategy Log</text>
  <text x="1030" y="172" class="sm">Navigator memory · last 6 trials</text>
  <text x="1030" y="192" class="monos">[#7] ✓ s=2.361 Δ=+0.004</text>
  <text x="1030" y="207" class="monos">[#6] ✗ parse-miss</text>
  <text x="1030" y="222" class="monos">[#5] ✓ s=2.357 Δ=+0.000</text>
  <text x="1030" y="244" class="bx tNav" font-size="10.5">rule: avoid any Δ ≤ 0</text>

  <!-- Legend -->
  <rect class="box" x="1018" y="300" width="194" height="266" fill="#FFFFFF" stroke="#C9D2DA" stroke-width="1.2"/>
  <text x="1030" y="322" class="eyebrow">LEGEND</text>
  <g>
    <rect x="1030" y="334" width="16" height="11" rx="2.5" fill="#E6F2F2" stroke="#0E7C86"/><text x="1054" y="343" class="bx">Speculator — cheap tier</text>
    <rect x="1030" y="354" width="16" height="11" rx="2.5" fill="#F8E9E2" stroke="#B0472E"/><text x="1054" y="363" class="bx">Navigator — frontier tier</text>
    <rect x="1030" y="374" width="16" height="11" rx="2.5" fill="#EDF1F4" stroke="#3E4C59"/><text x="1054" y="383" class="bx">Population — substrate</text>
    <rect x="1030" y="394" width="16" height="11" rx="2.5" fill="#EDEAF6" stroke="#4B3F8F"/><text x="1054" y="403" class="bx">Advisor — feedback prior</text>
  </g>
  <line x1="1030" y1="418" x2="1200" y2="418" stroke="#E4E9EE"/>
  <g>
    <line x1="1030" y1="432" x2="1058" y2="432" class="fThick"/><text x="1066" y="436" class="sm">frequent · cheap call</text>
    <line x1="1030" y1="450" x2="1058" y2="450" class="fThin"/><text x="1066" y="454" class="sm">rare · expensive call</text>
    <line x1="1030" y1="468" x2="1058" y2="468" class="fDash"/><text x="1066" y="472" class="sm">feedback injection</text>
  </g>
  <line x1="1030" y1="486" x2="1200" y2="486" stroke="#E4E9EE"/>
  <rect x="1030" y="500" width="170" height="11" rx="5.5" fill="url(#gauge)"/>
  <text x="1030" y="528" class="sm">stagnation → mode:</text>
  <text x="1030" y="543" class="monos">synthesis · surgical · shift</text>
  <text x="1030" y="558" class="sm">(low → mid → high)</text>

  <!-- Economics card -->
  <rect class="box" x="1018" y="668" width="194" height="150" fill="#F4F7F7" stroke="#0E7C86" stroke-width="1.2"/>
  <text x="1030" y="690" class="hd tSpec" font-size="13">Two-tier economics</text>
  <text x="1030" y="712" class="bx">Frontier calls are <tspan font-weight="700">rare</tspan>:</text>
  <text x="1030" y="728" class="mono">1 every 50 evals</text>
  <text x="1030" y="750" class="bx">Cheap calls are <tspan font-weight="700">continuous</tspan>:</text>
  <text x="1030" y="766" class="mono">×4 workers, until budget</text>
  <text x="1030" y="792" class="bx" font-size="10.5">Difficulty is long&#8209;tailed —</text>
  <text x="1030" y="807" class="bx" font-size="10.5">pay for depth only where needed.</text>
</svg>
