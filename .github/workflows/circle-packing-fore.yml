name: Circle Packing FORE Smoke

on:
  workflow_dispatch:
    inputs:
      iterations:
        description: "Number of FORE iterations to run"
        required: false
        default: "2"
      model:
        description: "OpenRouter model id routed through SkyDiscover"
        required: false
        default: "openrouter/openai/gpt-5"

concurrency:
  group: circle-packing-fore-${{ github.ref }}
  cancel-in-progress: true

jobs:
  circle-packing:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
      OPENAI_API_BASE: https://openrouter.ai/api/v1
      OPENAI_BASE_URL: https://openrouter.ai/api/v1

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up uv
        uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.12"
          enable-cache: true

      - name: Validate OpenRouter secret
        run: |
          if [ -z "$OPENROUTER_API_KEY" ]; then
            echo "Missing GitHub secret: OPENROUTER_API_KEY"
            exit 1
          fi

      - name: Install dependencies
        run: |
          uv sync
          uv run python scripts/install_benchmark_requirements.py \
            benchmarks/math/circle_packing

      - name: Run FORE on circle_packing
        env:
          OPENAI_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
        run: |
          uv run skydiscover-run benchmarks/math/circle_packing/initial_program.py \
            benchmarks/math/circle_packing/evaluator.py \
            --config benchmarks/math/circle_packing/config.yaml \
            --search fore \
            --model "${{ inputs.model }}" \
            --iterations "${{ inputs.iterations }}" \
            --output "outputs/github-actions/circle_packing_fore_${{ github.run_id }}"

      - name: Upload run outputs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: circle-packing-fore-output-${{ github.run_id }}
          path: outputs/github-actions/
          if-no-files-found: warn
