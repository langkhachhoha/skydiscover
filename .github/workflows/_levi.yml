name: LEVI (reusable)

# Reusable workflow that runs LEVI on a self-contained example directory
# (anything under levi/examples/<name>/ with a problem.py exporting
# PROBLEM_DESCRIPTION, FUNCTION_SIGNATURE, score_fn, ...).
#
# Per-problem workflows should call this with `uses:` and pass `example_dir`
# plus whatever budget knobs they want exposed as inputs. The leaf workflow
# is then ~15 lines — no copy-paste of setup steps.

on:
  workflow_dispatch:
    inputs:
      example_dir:
        description: "Path to the LEVI example dir (e.g. levi/examples/circle_packing)"
        required: true
        type: string
      problem_module:
        description: "Python module name to import from example_dir"
        required: false
        type: string
        default: "problem"
      evaluations:
        description: "Max evaluations (blank to disable)"
        required: false
        type: string
        default: ""
      dollars:
        description: "Max USD spend (blank to disable)"
        required: false
        type: string
        default: ""
      seconds:
        description: "Wall-clock cap in seconds (blank to disable)"
        required: false
        type: string
        default: ""
      target_score:
        description: "Stop early at this score (blank to disable)"
        required: false
        type: string
        default: ""
      small_model:
        description: "OpenRouter id of the small / mutation model"
        required: false
        type: string
        default: "openrouter/qwen/qwen3-30b-a3b-instruct-2507"
      large_model:
        description: "OpenRouter id of the large / paradigm-shift model"
        required: false
        type: string
        default: "openrouter/openai/gpt-5"
      workers:
        description: "Concurrent LLM workers"
        required: false
        type: string
        default: "4"
      eval_processes:
        description: "Concurrent evaluator processes"
        required: false
        type: string
        default: "4"
      eval_timeout:
        description: "Per-candidate evaluation timeout (seconds)"
        required: false
        type: string
        default: "600"
      init_variants_per_seed:
        description: "Init Phase 2 — variants per diverse seed (Levi default 20). Blank keeps default. Total LLM variants ≈ this × (# seeds after Phase 1)."
        required: false
        type: string
        default: ""
      init_diverse_seeds:
        description: "Init Phase 1 — diverse seed count target (Levi default 4). Blank keeps default."
        required: false
        type: string
        default: ""

jobs:
  levi:
    runs-on: ubuntu-latest
    env:
      OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
      OPENAI_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
      OPENAI_API_BASE: https://openrouter.ai/api/v1
      OPENAI_BASE_URL: https://openrouter.ai/api/v1
      PYTHONUNBUFFERED: "1"
      OUTPUT_DIR: outputs/github-actions/levi_${{ github.run_id }}

    steps:
      - name: Checkout (with submodules)
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up uv
        uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.12"
          enable-cache: true

      - name: Validate OpenRouter secret
        run: |
          if [ -z "$OPENROUTER_API_KEY" ]; then
            echo "::error::Missing GitHub secret OPENROUTER_API_KEY"
            exit 1
          fi

      - name: Install LEVI (vendored in-repo)
        working-directory: levi
        run: uv sync

      - name: Run LEVI on ${{ inputs.example_dir }}
        working-directory: levi
        run: |
          INIT_OPTS=""
          if [ -n "${{ inputs.init_variants_per_seed }}" ]; then
            INIT_OPTS="$INIT_OPTS --init-variants-per-seed ${{ inputs.init_variants_per_seed }}"
          fi
          if [ -n "${{ inputs.init_diverse_seeds }}" ]; then
            INIT_OPTS="$INIT_OPTS --init-diverse-seeds ${{ inputs.init_diverse_seeds }}"
          fi
          uv run python ../scripts/run_levi.py \
            --example-dir "../${{ inputs.example_dir }}" \
            --problem-module "${{ inputs.problem_module }}" \
            --small-model "${{ inputs.small_model }}" \
            --large-model "${{ inputs.large_model }}" \
            --evals "${{ inputs.evaluations }}" \
            --dollars "${{ inputs.dollars }}" \
            --seconds "${{ inputs.seconds }}" \
            --target-score "${{ inputs.target_score }}" \
            --workers "${{ inputs.workers }}" \
            --eval-processes "${{ inputs.eval_processes }}" \
            --eval-timeout "${{ inputs.eval_timeout }}" \
            --output-dir "../${{ env.OUTPUT_DIR }}" \
            $INIT_OPTS

      - name: Append summary
        if: always()
        run: |
          summary="${{ env.OUTPUT_DIR }}/summary.json"
          if [ -f "$summary" ]; then
            echo "### LEVI run summary — ${{ inputs.example_dir }}" >> "$GITHUB_STEP_SUMMARY"
            echo '```json' >> "$GITHUB_STEP_SUMMARY"
            cat "$summary" >> "$GITHUB_STEP_SUMMARY"
            echo '```' >> "$GITHUB_STEP_SUMMARY"
          else
            echo "No summary.json produced — check job logs." >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Upload run artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: levi-${{ github.run_id }}
          path: ${{ env.OUTPUT_DIR }}
          if-no-files-found: warn
