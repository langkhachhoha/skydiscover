name: LEVI (reusable)

# Reusable workflow that runs LEVI on a self-contained example directory
# under ./levi/examples/<name>/ (problem.py exports PROBLEM_DESCRIPTION,
# FUNCTION_SIGNATURE, score_fn, ...).
#
# The LEVI framework is vendored in-repo at ./levi/ (plain directory), not a
# submodule. Checkout uses submodules: recursive only so other repo submodules
# (e.g. benchmarks) still initialize when present.
#
# Per-problem workflows should call this with `uses:` and pass `example_dir`
# plus whatever budget knobs they want exposed as inputs.

on:
  workflow_dispatch:
    inputs:
      example_dir:
        description: "Path to the LEVI example dir (e.g. levi/examples/circle_packing)"
        required: true
        type: string
      problem_module:
        description: "Python module name to import from example_dir"
        required: false
        type: string
        default: "problem"
      evaluations:
        description: "Max evaluations (blank to disable)"
        required: false
        type: string
        default: ""
      dollars:
        description: "Max USD spend (blank to disable)"
        required: false
        type: string
        default: ""
      seconds:
        description: "Wall-clock cap in seconds (blank to disable)"
        required: false
        type: string
        default: ""
      target_score:
        description: "Stop early at this score (blank to disable)"
        required: false
        type: string
        default: ""
      small_model:
        description: "OpenRouter id of the small / mutation model"
        required: false
        type: string
        default: "openrouter/qwen/qwen3-30b-a3b-instruct-2507"
      large_model:
        description: "OpenRouter id of the large / paradigm-shift model"
        required: false
        type: string
        default: "openrouter/openai/gpt-5"
      workers:
        description: "Concurrent LLM workers"
        required: false
        type: string
        default: "4"
      eval_processes:
        description: "Concurrent evaluator processes"
        required: false
        type: string
        default: "4"
      eval_timeout:
        description: "Per-candidate evaluation timeout (seconds)"
        required: false
        type: string
        default: "600"
      init_variants_per_seed:
        description: "Init Phase 2 — variants per diverse seed (Levi default 20). Blank keeps default."
        required: false
        type: string
        default: ""
      init_diverse_seeds:
        description: "Init Phase 1 — diverse seed count target (Levi default 4). Blank keeps default."
        required: false
        type: string
        default: ""
      n_centroids:
        description: "CVT archive cells (Levi default 50). Blank keeps default."
        required: false
        type: string
        default: ""
      prompt_bank:
        description: "Enable the mutation prompt-bank + temperature-bank (joint bandit). Off by default."
        required: false
        type: boolean
        default: false
      pe_disabled:
        description: "Disable Punctuated Equilibrium entirely."
        required: false
        type: boolean
        default: false
      code_repair_disabled:
        description: "Disable the one-shot light-model code-repair sub-pipeline."
        required: false
        type: boolean
        default: false
      adaptive_island_disabled:
        description: "Disable Adaptive Island Expansion (PE candidates that fail standard admission are discarded)."
        required: false
        type: boolean
        default: false
      sal_disabled:
        description: "Disable SAL/PPS entirely. Producer ignores stagnation; bandit reverts to weighted roulette."
        required: false
        type: boolean
        default: false
      advanced_options:
        description: "Advanced config options as JSON string (e.g. '{\"pe_interval\":15,\"code_repair_every_n\":10}')"
        required: false
        type: string
        default: ""

jobs:
  levi:
    runs-on: ubuntu-latest
    env:
      OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
      OPENAI_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
      OPENAI_API_BASE: https://openrouter.ai/api/v1
      OPENAI_BASE_URL: https://openrouter.ai/api/v1
      PYTHONUNBUFFERED: "1"
      OUTPUT_DIR: outputs/github-actions/levi_${{ github.run_id }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Verify in-tree LEVI
        run: |
          test -f levi/pyproject.toml || { echo "::error::Expected ./levi/pyproject.toml (LEVI is tracked in-repo)"; exit 1; }

      - name: Set up uv
        uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.12"
          enable-cache: true

      - name: Validate OpenRouter secret
        run: |
          if [ -z "$OPENROUTER_API_KEY" ]; then
            echo "::error::Missing GitHub secret OPENROUTER_API_KEY"
            exit 1
          fi

      - name: Install LEVI (vendored in-repo)
        working-directory: levi
        run: uv sync

      - name: Parse advanced options
        if: inputs.advanced_options != ''
        run: |
          # Parse JSON and convert to environment variables
          echo "${{ inputs.advanced_options }}" | python3 -c "
          import json, sys, os
          try:
              opts = json.loads(sys.stdin.read())
              for k, v in opts.items():
                  env_name = f'ADV_{k.upper()}'
                  print(f'{env_name}={v}')
          except Exception as e:
              print(f'Error parsing advanced options: {e}', file=sys.stderr)
              sys.exit(1)
          " >> $GITHUB_ENV

      - name: Run LEVI on ${{ inputs.example_dir }}
        working-directory: levi
        run: |
          INIT_OPTS=""
          if [ -n "${{ inputs.init_variants_per_seed }}" ]; then
            INIT_OPTS="$INIT_OPTS --init-variants-per-seed ${{ inputs.init_variants_per_seed }}"
          fi
          if [ -n "${{ inputs.init_diverse_seeds }}" ]; then
            INIT_OPTS="$INIT_OPTS --init-diverse-seeds ${{ inputs.init_diverse_seeds }}"
          fi
          
          CVT_OPTS=""
          if [ -n "${{ inputs.n_centroids }}" ]; then
            CVT_OPTS="$CVT_OPTS --n-centroids ${{ inputs.n_centroids }}"
          fi
          
          PROMPT_BANK_OPTS=""
          if [ "${{ inputs.prompt_bank }}" = "true" ]; then
            PROMPT_BANK_OPTS="--prompt-bank"
          fi

          # Main feature toggles
          FEATURE_OPTS=""
          if [ "${{ inputs.pe_disabled }}" = "true" ]; then
            FEATURE_OPTS="$FEATURE_OPTS --no-pe"
          fi
          if [ "${{ inputs.code_repair_disabled }}" = "true" ]; then
            FEATURE_OPTS="$FEATURE_OPTS --no-code-repair"
          fi
          if [ "${{ inputs.adaptive_island_disabled }}" = "true" ]; then
            FEATURE_OPTS="$FEATURE_OPTS --no-adaptive-island"
          fi
          if [ "${{ inputs.sal_disabled }}" = "true" ]; then
            FEATURE_OPTS="$FEATURE_OPTS --no-sal"
          fi

          # Advanced options from JSON (if provided)
          ADV_OPTS=""
          [ -n "$ADV_PE_INTERVAL" ] && ADV_OPTS="$ADV_OPTS --pe-interval $ADV_PE_INTERVAL"
          [ -n "$ADV_PE_N_CLUSTERS" ] && ADV_OPTS="$ADV_OPTS --pe-n-clusters $ADV_PE_N_CLUSTERS"
          [ -n "$ADV_PE_N_VARIANTS" ] && ADV_OPTS="$ADV_OPTS --pe-n-variants $ADV_PE_N_VARIANTS"
          [ -n "$ADV_CODE_REPAIR_EVERY_N" ] && ADV_OPTS="$ADV_OPTS --code-repair-every-n $ADV_CODE_REPAIR_EVERY_N"
          [ -n "$ADV_CODE_REPAIR_MAX" ] && ADV_OPTS="$ADV_OPTS --code-repair-max $ADV_CODE_REPAIR_MAX"
          [ -n "$ADV_ISLAND_STAGNATION" ] && ADV_OPTS="$ADV_OPTS --island-stagnation $ADV_ISLAND_STAGNATION"
          [ -n "$ADV_SAL_TAU" ] && ADV_OPTS="$ADV_OPTS --sal-tau $ADV_SAL_TAU"

          uv run python ../scripts/run_levi.py \
            --example-dir "../${{ inputs.example_dir }}" \
            --problem-module "${{ inputs.problem_module }}" \
            --small-model "${{ inputs.small_model }}" \
            --large-model "${{ inputs.large_model }}" \
            --evals "${{ inputs.evaluations }}" \
            --dollars "${{ inputs.dollars }}" \
            --seconds "${{ inputs.seconds }}" \
            --target-score "${{ inputs.target_score }}" \
            --workers "${{ inputs.workers }}" \
            --eval-processes "${{ inputs.eval_processes }}" \
            --eval-timeout "${{ inputs.eval_timeout }}" \
            --output-dir "../${{ env.OUTPUT_DIR }}" \
            $INIT_OPTS \
            $CVT_OPTS \
            $PROMPT_BANK_OPTS \
            $FEATURE_OPTS \
            $ADV_OPTS

      - name: Upload run artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: levi-${{ github.run_id }}
          path: ${{ env.OUTPUT_DIR }}
          if-no-files-found: warn
