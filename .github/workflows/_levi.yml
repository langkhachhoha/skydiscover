name: LEVI (reusable)

# Reusable workflow that runs LEVI on a self-contained example directory
# under ./levi/examples/<name>/ (problem.py exports PROBLEM_DESCRIPTION,
# FUNCTION_SIGNATURE, score_fn, ...).
#
# The LEVI framework is vendored in-repo at ./levi/ (plain directory), not a
# submodule. Checkout uses submodules: recursive only so other repo submodules
# (e.g. benchmarks) still initialize when present.
#
# Per-problem workflows should call this with `uses:` and pass `example_dir`
# plus whatever budget knobs they want exposed as inputs.

on:
  workflow_dispatch:
    inputs:
      example_dir:
        description: "Path to the LEVI example dir (e.g. levi/examples/circle_packing)"
        required: true
        type: string
      problem_module:
        description: "Python module name to import from example_dir"
        required: false
        type: string
        default: "problem"
      evaluations:
        description: "Max evaluations (blank to disable)"
        required: false
        type: string
        default: ""
      dollars:
        description: "Max USD spend (blank to disable)"
        required: false
        type: string
        default: ""
      seconds:
        description: "Wall-clock cap in seconds (blank to disable)"
        required: false
        type: string
        default: ""
      target_score:
        description: "Stop early at this score (blank to disable)"
        required: false
        type: string
        default: ""
      small_model:
        description: "OpenRouter id of the small / mutation model"
        required: false
        type: string
        default: "openrouter/qwen/qwen3-30b-a3b-instruct-2507"
      large_model:
        description: "OpenRouter id of the large / paradigm-shift model"
        required: false
        type: string
        default: "openrouter/openai/gpt-5"
      workers:
        description: "Concurrent LLM workers"
        required: false
        type: string
        default: "4"
      eval_processes:
        description: "Concurrent evaluator processes"
        required: false
        type: string
        default: "4"
      eval_timeout:
        description: "Per-candidate evaluation timeout (seconds)"
        required: false
        type: string
        default: "600"
      init_variants_per_seed:
        description: "Init Phase 2 — variants per diverse seed (Levi default 20). Blank keeps default. Total LLM variants ≈ this × (# seeds after Phase 1)."
        required: false
        type: string
        default: ""
      init_diverse_seeds:
        description: "Init Phase 1 — diverse seed count target (Levi default 4). Blank keeps default."
        required: false
        type: string
        default: ""
      n_centroids:
        description: "CVT archive cells (Levi default 50). Blank keeps default."
        required: false
        type: string
        default: ""
      prompt_bank:
        description: "Enable the mutation prompt-bank + temperature-bank (joint bandit). Off by default."
        required: false
        type: boolean
        default: false
      prompt_bank_prompts_file:
        description: "Path to prompts JSON (relative to repo root). Blank → levi/examples/mutation_prompts.json (shared default)."
        required: false
        type: string
        default: ""
      prompt_bank_temperatures_file:
        description: "Path to temperatures JSON (relative to repo root). Blank → levi/examples/mutation_temperatures.json (shared default)."
        required: false
        type: string
        default: ""

      # ---------------- Punctuated Equilibrium overrides ----------------
      pe_interval:
        description: "Trigger PE every N evaluations (Levi default 10). Blank keeps default."
        required: false
        type: string
        default: ""
      pe_n_clusters:
        description: "Number of behavioural clusters for picking PE anchors (default 3). Blank keeps default."
        required: false
        type: string
        default: ""
      pe_n_variants:
        description: "Light-model variants of the heavy paradigm shift per PE event (default 3). Blank keeps default."
        required: false
        type: string
        default: ""
      pe_disabled:
        description: "Disable Punctuated Equilibrium entirely."
        required: false
        type: boolean
        default: false

      # ---------------- Strategy Log (post-PE summariser) ----------------
      strategy_log_disabled:
        description: "Disable the strategy-history summariser (heavy prompt won't see past PE attempts)."
        required: false
        type: boolean
        default: false
      strategy_log_entries:
        description: "How many most-recent strategy records to render into the heavy prompt (default 8). Blank keeps default."
        required: false
        type: string
        default: ""

      # ---------------- Code Error Repair ----------------
      code_repair_disabled:
        description: "Disable the one-shot light-model code-repair sub-pipeline."
        required: false
        type: boolean
        default: false
      code_repair_every_n:
        description: "Fire one repair attempt every N main-loop offspring (default 8). Blank keeps default."
        required: false
        type: string
        default: ""
      code_repair_max:
        description: "Hard cap on total repair attempts per run (default 100). Blank keeps default."
        required: false
        type: string
        default: ""
      code_repair_beta:
        description: "Zipfian exponent for rank-by-parent-score selection from the error buffer (default 1.5). Blank keeps default."
        required: false
        type: string
        default: ""
      code_repair_buffer:
        description: "Bounded error-buffer size (default 64). Blank keeps default."
        required: false
        type: string
        default: ""

      # ---------------- Adaptive Island Expansion ----------------
      # AdaEvolve-style growth: when a PE candidate fails standard admission
      # under high stagnation, open a NEW cell at its own behaviour vector.
      adaptive_island_disabled:
        description: "Disable Adaptive Island Expansion (PE candidates that fail standard admission are discarded)."
        required: false
        type: boolean
        default: false
      island_stagnation:
        description: "Minimum stagnation s(t) for island expansion to fire (default 0.7). Blank keeps default."
        required: false
        type: string
        default: ""
      island_max:
        description: "Maximum island expansions per run (default 16). Blank keeps default."
        required: false
        type: string
        default: ""
      island_max_centroids:
        description: "Hard ceiling on total centroids (default 200). Blank keeps default."
        required: false
        type: string
        default: ""

      # ---------------- PPS — Posterior-Plateau Stagnation ----------------
      sal_tau:
        description: "Plateau length τ (evals) at which PPS plateau term saturates to 1.0 (default 80). Blank keeps default."
        required: false
        type: string
        default: ""
      sal_disabled:
        description: "Disable SAL/PPS entirely. Producer ignores stagnation; bandit reverts to weighted roulette."
        required: false
        type: boolean
        default: false

jobs:
  levi:
    runs-on: ubuntu-latest
    env:
      OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
      OPENAI_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
      OPENAI_API_BASE: https://openrouter.ai/api/v1
      OPENAI_BASE_URL: https://openrouter.ai/api/v1
      PYTHONUNBUFFERED: "1"
      OUTPUT_DIR: outputs/github-actions/levi_${{ github.run_id }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Verify in-tree LEVI
        run: |
          test -f levi/pyproject.toml || { echo "::error::Expected ./levi/pyproject.toml (LEVI is tracked in-repo)"; exit 1; }

      - name: Set up uv
        uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.12"
          enable-cache: true

      - name: Validate OpenRouter secret
        run: |
          if [ -z "$OPENROUTER_API_KEY" ]; then
            echo "::error::Missing GitHub secret OPENROUTER_API_KEY"
            exit 1
          fi

      - name: Install LEVI (vendored in-repo)
        working-directory: levi
        run: uv sync

      - name: Run LEVI on ${{ inputs.example_dir }}
        working-directory: levi
        run: |
          INIT_OPTS=""
          if [ -n "${{ inputs.init_variants_per_seed }}" ]; then
            INIT_OPTS="$INIT_OPTS --init-variants-per-seed ${{ inputs.init_variants_per_seed }}"
          fi
          if [ -n "${{ inputs.init_diverse_seeds }}" ]; then
            INIT_OPTS="$INIT_OPTS --init-diverse-seeds ${{ inputs.init_diverse_seeds }}"
          fi
          CVT_OPTS=""
          if [ -n "${{ inputs.n_centroids }}" ]; then
            CVT_OPTS="$CVT_OPTS --n-centroids ${{ inputs.n_centroids }}"
          fi
          PROMPT_BANK_OPTS=""
          if [ "${{ inputs.prompt_bank }}" = "true" ]; then
            PROMPT_BANK_OPTS="--prompt-bank"
            # Paths are relative to repo root (we run from ./levi, so prepend ../).
            if [ -n "${{ inputs.prompt_bank_prompts_file }}" ]; then
              PROMPT_BANK_OPTS="$PROMPT_BANK_OPTS --prompt-bank-prompts-file ../${{ inputs.prompt_bank_prompts_file }}"
            fi
            if [ -n "${{ inputs.prompt_bank_temperatures_file }}" ]; then
              PROMPT_BANK_OPTS="$PROMPT_BANK_OPTS --prompt-bank-temperatures-file ../${{ inputs.prompt_bank_temperatures_file }}"
            fi
          fi

          # Punctuated Equilibrium overrides
          PE_OPTS=""
          if [ -n "${{ inputs.pe_interval }}" ]; then
            PE_OPTS="$PE_OPTS --pe-interval ${{ inputs.pe_interval }}"
          fi
          if [ -n "${{ inputs.pe_n_clusters }}" ]; then
            PE_OPTS="$PE_OPTS --pe-n-clusters ${{ inputs.pe_n_clusters }}"
          fi
          if [ -n "${{ inputs.pe_n_variants }}" ]; then
            PE_OPTS="$PE_OPTS --pe-n-variants ${{ inputs.pe_n_variants }}"
          fi
          if [ "${{ inputs.pe_disabled }}" = "true" ]; then
            PE_OPTS="$PE_OPTS --no-pe"
          fi

          # Strategy Log
          STRATEGY_OPTS=""
          if [ "${{ inputs.strategy_log_disabled }}" = "true" ]; then
            STRATEGY_OPTS="$STRATEGY_OPTS --no-strategy-log"
          fi
          if [ -n "${{ inputs.strategy_log_entries }}" ]; then
            STRATEGY_OPTS="$STRATEGY_OPTS --strategy-log-entries ${{ inputs.strategy_log_entries }}"
          fi

          # Code Repair
          REPAIR_OPTS=""
          if [ "${{ inputs.code_repair_disabled }}" = "true" ]; then
            REPAIR_OPTS="$REPAIR_OPTS --no-code-repair"
          fi
          if [ -n "${{ inputs.code_repair_every_n }}" ]; then
            REPAIR_OPTS="$REPAIR_OPTS --code-repair-every-n ${{ inputs.code_repair_every_n }}"
          fi
          if [ -n "${{ inputs.code_repair_max }}" ]; then
            REPAIR_OPTS="$REPAIR_OPTS --code-repair-max ${{ inputs.code_repair_max }}"
          fi
          if [ -n "${{ inputs.code_repair_beta }}" ]; then
            REPAIR_OPTS="$REPAIR_OPTS --code-repair-beta ${{ inputs.code_repair_beta }}"
          fi
          if [ -n "${{ inputs.code_repair_buffer }}" ]; then
            REPAIR_OPTS="$REPAIR_OPTS --code-repair-buffer ${{ inputs.code_repair_buffer }}"
          fi

          # Adaptive Island Expansion
          ISLAND_OPTS=""
          if [ "${{ inputs.adaptive_island_disabled }}" = "true" ]; then
            ISLAND_OPTS="$ISLAND_OPTS --no-adaptive-island"
          fi
          if [ -n "${{ inputs.island_stagnation }}" ]; then
            ISLAND_OPTS="$ISLAND_OPTS --island-stagnation ${{ inputs.island_stagnation }}"
          fi
          if [ -n "${{ inputs.island_max }}" ]; then
            ISLAND_OPTS="$ISLAND_OPTS --island-max ${{ inputs.island_max }}"
          fi
          if [ -n "${{ inputs.island_max_centroids }}" ]; then
            ISLAND_OPTS="$ISLAND_OPTS --island-max-centroids ${{ inputs.island_max_centroids }}"
          fi

          # PPS / SAL
          SAL_OPTS=""
          if [ -n "${{ inputs.sal_tau }}" ]; then
            SAL_OPTS="$SAL_OPTS --sal-tau ${{ inputs.sal_tau }}"
          fi
          if [ "${{ inputs.sal_disabled }}" = "true" ]; then
            SAL_OPTS="$SAL_OPTS --no-sal"
          fi

          uv run python ../scripts/run_levi.py \
            --example-dir "../${{ inputs.example_dir }}" \
            --problem-module "${{ inputs.problem_module }}" \
            --small-model "${{ inputs.small_model }}" \
            --large-model "${{ inputs.large_model }}" \
            --evals "${{ inputs.evaluations }}" \
            --dollars "${{ inputs.dollars }}" \
            --seconds "${{ inputs.seconds }}" \
            --target-score "${{ inputs.target_score }}" \
            --workers "${{ inputs.workers }}" \
            --eval-processes "${{ inputs.eval_processes }}" \
            --eval-timeout "${{ inputs.eval_timeout }}" \
            --output-dir "../${{ env.OUTPUT_DIR }}" \
            $INIT_OPTS \
            $CVT_OPTS \
            $PROMPT_BANK_OPTS \
            $PE_OPTS \
            $STRATEGY_OPTS \
            $REPAIR_OPTS \
            $ISLAND_OPTS \
            $SAL_OPTS

      - name: Upload run artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: levi-${{ github.run_id }}
          path: ${{ env.OUTPUT_DIR }}
          if-no-files-found: warn
