name: LEVI native circle_packing (OpenRouter)

# Runs LEVI's *own* circle_packing example (levi/examples/circle_packing/),
# not the SkyDiscover benchmarks/math/circle_packing version. Every budget
# knob (evaluations / dollars / seconds / target score) is a workflow input
# — leave a field empty to skip that constraint. At least one must be set.
#
# Required GitHub secret:
#   OPENROUTER_API_KEY  (https://openrouter.ai/keys)

on:
  workflow_dispatch:
    inputs:
      evaluations:
        description: "Max evaluations (leave blank to skip)"
        required: false
        default: "100"
      dollars:
        description: "Max USD spend (leave blank to skip)"
        required: false
        default: ""
      seconds:
        description: "Wall-clock cap in seconds (leave blank to skip)"
        required: false
        default: ""
      target_score:
        description: "Stop early once this score is reached (leave blank to skip)"
        required: false
        default: ""
      small_model:
        description: "OpenRouter id of the small / mutation model"
        required: false
        default: "openrouter/qwen/qwen3-30b-a3b-instruct-2507"
      large_model:
        description: "OpenRouter id of the large / paradigm-shift model"
        required: false
        default: "openrouter/openai/gpt-5"
      workers:
        description: "Concurrent LLM workers"
        required: false
        default: "4"
      eval_processes:
        description: "Concurrent evaluator processes"
        required: false
        default: "4"
      eval_timeout:
        description: "Per-candidate evaluation timeout (seconds)"
        required: false
        default: "600"

concurrency:
  group: levi-native-circle-packing-${{ github.ref }}
  cancel-in-progress: true

jobs:
  levi:
    runs-on: ubuntu-latest
    # timeout-minutes: 720
    env:
      OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
      OPENAI_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
      OPENAI_API_BASE: https://openrouter.ai/api/v1
      OPENAI_BASE_URL: https://openrouter.ai/api/v1
      PYTHONUNBUFFERED: "1"

    steps:
      - name: Checkout (with submodules)
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up uv
        uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.12"
          enable-cache: true

      - name: Validate OpenRouter secret
        run: |
          if [ -z "$OPENROUTER_API_KEY" ]; then
            echo "::error::Missing GitHub secret OPENROUTER_API_KEY"
            exit 1
          fi

      - name: Install SkyDiscover base env
        run: |
          uv sync

      - name: Install LEVI (vendored submodule, editable)
        run: |
          uv pip install -e ./levi

      - name: Run LEVI native circle_packing
        run: |
          uv run python scripts/run_levi_native_circle_packing.py \
            --small-model "${{ inputs.small_model }}" \
            --large-model "${{ inputs.large_model }}" \
            --evals "${{ inputs.evaluations }}" \
            --dollars "${{ inputs.dollars }}" \
            --seconds "${{ inputs.seconds }}" \
            --target-score "${{ inputs.target_score }}" \
            --workers "${{ inputs.workers }}" \
            --eval-processes "${{ inputs.eval_processes }}" \
            --eval-timeout "${{ inputs.eval_timeout }}" \
            --output-dir "outputs/github-actions/levi_native_cp_${{ github.run_id }}"

      - name: Append summary
        if: always()
        run: |
          summary="outputs/github-actions/levi_native_cp_${{ github.run_id }}/summary.json"
          if [ -f "$summary" ]; then
            echo "### LEVI native circle_packing summary" >> "$GITHUB_STEP_SUMMARY"
            echo '```json' >> "$GITHUB_STEP_SUMMARY"
            cat "$summary" >> "$GITHUB_STEP_SUMMARY"
            echo '```' >> "$GITHUB_STEP_SUMMARY"
          else
            echo "No summary.json produced — check job logs." >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Upload run artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: levi-native-cp-${{ github.run_id }}
          path: outputs/github-actions/
          if-no-files-found: warn
