name: LEVI on ADRS (OpenRouter)

# Runs LEVI on a SkyDiscover ADRS benchmark via OpenRouter. Only the evaluation
# count is exposed — dollar/seconds budgets are intentionally left unset.
#
# Required GitHub secret:
#   OPENROUTER_API_KEY  (https://openrouter.ai/keys)

on:
  workflow_dispatch:
    inputs:
      benchmark:
        description: "Path to the benchmark directory"
        required: true
        default: "benchmarks/ADRS/txn_scheduling"
        type: choice
        options:
          - benchmarks/ADRS/txn_scheduling
          - benchmarks/ADRS/llm_sql
          - benchmarks/ADRS/prism
          - benchmarks/ADRS/cloudcast
          - benchmarks/ADRS/eplb
      evaluations:
        description: "Maximum number of evaluations"
        required: false
        default: "100"
      small_model:
        description: "OpenRouter id of the small / mutation model"
        required: false
        default: "openrouter/qwen/qwen3-30b-a3b-instruct-2507"
      large_model:
        description: "OpenRouter id of the large / paradigm-shift model"
        required: false
        default: "openrouter/openai/gpt-5"

concurrency:
  group: levi-adrs-${{ github.ref }}-${{ inputs.benchmark }}
  cancel-in-progress: true

jobs:
  levi:
    runs-on: ubuntu-latest
    # timeout-minutes: 720
    env:
      OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
      OPENAI_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
      OPENAI_API_BASE: https://openrouter.ai/api/v1
      OPENAI_BASE_URL: https://openrouter.ai/api/v1
      PYTHONUNBUFFERED: "1"

    steps:
      - name: Checkout (with submodules)
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up uv
        uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.12"
          enable-cache: true

      - name: Validate OpenRouter secret
        run: |
          if [ -z "$OPENROUTER_API_KEY" ]; then
            echo "::error::Missing GitHub secret OPENROUTER_API_KEY"
            exit 1
          fi

      - name: Install SkyDiscover + ADRS extras
        run: |
          uv sync --extra adrs
          uv pip install pyyaml

      - name: Install benchmark-specific Python requirements
        run: |
          uv run python scripts/install_benchmark_requirements.py "${{ inputs.benchmark }}" || true

      - name: Install LEVI (vendored submodule, editable)
        run: |
          uv pip install -e ./levi

      - name: Run LEVI on ${{ inputs.benchmark }}
        run: |
          uv run python scripts/run_levi_skydiscover.py \
            --benchmark "${{ inputs.benchmark }}" \
            --small-model "${{ inputs.small_model }}" \
            --large-model "${{ inputs.large_model }}" \
            --evals "${{ inputs.evaluations }}" \
            --output-dir "outputs/github-actions/levi_${{ github.run_id }}"

      - name: Append summary
        if: always()
        run: |
          summary="outputs/github-actions/levi_${{ github.run_id }}/summary.json"
          if [ -f "$summary" ]; then
            echo "### LEVI run summary" >> "$GITHUB_STEP_SUMMARY"
            echo '```json' >> "$GITHUB_STEP_SUMMARY"
            cat "$summary" >> "$GITHUB_STEP_SUMMARY"
            echo '```' >> "$GITHUB_STEP_SUMMARY"
          else
            echo "No summary.json produced — check job logs." >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Upload run artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: levi-${{ github.run_id }}
          path: outputs/github-actions/
          if-no-files-found: warn
