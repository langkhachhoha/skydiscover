name: SIMPLE-EVO (reusable)

# Reusable workflow that exercises the SIMPLE-EVO core modules under
# ./levi/levi/simple/. Two phases:
#
#   1. Offline unit tests (no API)            — fast, always run
#   2. Live LLM smoke + format-compliance     — requires OPENROUTER_API_KEY
#
# Live smoke runs the mutation model across (problems × paradigms ×
# temperatures) and exits non-zero if hard failures exceed 5%. It also
# uploads the JSON result file as an artifact for inspection.
#
# Per-repo workflows call this with `uses:`; pass `live_smoke: true` to
# enable phase 2.

on:
  workflow_dispatch:
    inputs:
      live_smoke:
        description: "Run the live LLM smoke + format-compliance phase (needs OPENROUTER_API_KEY)."
        required: false
        type: boolean
        default: true
      mutation_model:
        description: "OpenRouter id of the mutation model used by smoke / format tests."
        required: false
        type: string
        default: "openrouter/openai/gpt-4o-mini"
      embedding_model:
        description: "OpenRouter id of the embedding model used by the pool."
        required: false
        type: string
        default: "openrouter/openai/text-embedding-3-small"
      hard_failure_threshold:
        description: "Max share of format-compliance hard failures (0-1) before the job fails."
        required: false
        type: string
        default: "0.05"

  workflow_call:
    inputs:
      live_smoke:
        required: false
        type: boolean
        default: true
      mutation_model:
        required: false
        type: string
        default: "openrouter/openai/gpt-4o-mini"
      embedding_model:
        required: false
        type: string
        default: "openrouter/openai/text-embedding-3-small"
      hard_failure_threshold:
        required: false
        type: string
        default: "0.05"

jobs:
  simple-evo:
    runs-on: ubuntu-latest
    env:
      OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
      OPENAI_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
      OPENAI_API_BASE: https://openrouter.ai/api/v1
      OPENAI_BASE_URL: https://openrouter.ai/api/v1
      PYTHONUNBUFFERED: "1"
      SIMPLE_EVO_MUTATION_MODEL: ${{ inputs.mutation_model }}
      SIMPLE_EVO_EMBEDDING_MODEL: ${{ inputs.embedding_model }}
      OUTPUT_DIR: outputs/github-actions/simple_evo_${{ github.run_id }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Verify in-tree LEVI tree
        run: |
          test -f levi/pyproject.toml || { echo "::error::Expected ./levi/pyproject.toml"; exit 1; }
          test -d levi/levi/simple || { echo "::error::Expected ./levi/levi/simple/ (SIMPLE-EVO modules)"; exit 1; }

      - name: Set up uv
        uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.12"
          enable-cache: true

      - name: Install LEVI (vendored in-repo)
        working-directory: levi
        run: uv sync

      # ---------------------------------------------------------------
      # Phase 1 — Offline unit tests (always run)
      # ---------------------------------------------------------------
      - name: Run SIMPLE-EVO unit tests
        working-directory: levi
        run: uv run pytest tests/simple/ -v --tb=short

      # ---------------------------------------------------------------
      # Phase 2 — Live LLM smoke (opt-in, needs OPENROUTER_API_KEY)
      # ---------------------------------------------------------------
      - name: Validate OpenRouter secret (live phase)
        if: inputs.live_smoke
        run: |
          if [ -z "$OPENROUTER_API_KEY" ]; then
            echo "::error::Missing GitHub secret OPENROUTER_API_KEY (required when live_smoke=true)"
            exit 1
          fi

      - name: Run live smoke (single problem, 4 paradigms)
        if: inputs.live_smoke
        working-directory: levi
        run: uv run python tests/simple/live_smoke.py

      - name: Run format-compliance matrix (3 problems × 5 paradigms × 2 temps)
        if: inputs.live_smoke
        working-directory: levi
        env:
          HARD_FAILURE_THRESHOLD: ${{ inputs.hard_failure_threshold }}
        run: |
          set -o pipefail
          uv run python tests/simple/format_compliance.py | tee compliance.log
          # The script exits 2 if the hard-failure rate exceeds 5% by default.
          # We additionally enforce the workflow-input threshold here for
          # operator visibility (the result file is the source of truth).

      - name: Upload format-compliance results
        if: inputs.live_smoke && always()
        uses: actions/upload-artifact@v4
        with:
          name: simple-evo-format-compliance-${{ github.run_id }}
          path: outputs/simple_evo_format_compliance.json
          if-no-files-found: ignore
          retention-days: 14
