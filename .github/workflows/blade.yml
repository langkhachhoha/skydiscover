name: BLADE
run-name: BLADE — ${{ inputs.benchmark }} (${{ inputs.ablation }})

# Run BLADE Lite — adaptive MAP-Elites with hybrid AST + description-embedding
# behavior signature — on a self-contained LEVI example under
# ./levi/examples/<name>/ (problem.py exports PROBLEM_DESCRIPTION,
# FUNCTION_SIGNATURE, score_fn, optionally SEED_PROGRAM and INPUTS).
#
# The architecture is intentionally small:
#   - ClusterArchive (cells follow the population via periodic KMeans
#     re-clustering)
#   - RankSampler (Zipfian over score rank, β adaptive to stagnation)
#   - Monitor (plateau + accept-rate)
#   - PromptSampler over 5 mutate/crossover templates
#   - Parent Analyzer with accumulating cache + TARGETED_MUTATE_PROMPT
#   - Three-mode paradigm shift (synthesis ≤0.4 < surgical ≤0.7 < shift)
#   - 4-bucket Meta-Advisor (WORKING / SATURATED / TRY NEXT / AVOID)
#
# Paper-facing ablations exposed below: three on the behavior-signature /
# clustering side ("ast_only", "emb_only", "static_cells") and four on the
# operator / loop side ("no_meta_advice", "meta_errors_only",
# "no_targeted_mutate", "no_crossover"), plus "no_paradigm" which
# zeroes ``pe_interval``. The previous ``no_repair`` slot is gone — the
# repair branch was removed unconditionally.
#
# Only knobs that change run-to-run are first-class inputs; everything
# else (problem module name, eval-processes / timeout, pe-interval,
# embedding model, archive low-level parameters, advice inject
# probability, mode thresholds) is funnelled through a single JSON
# ``advanced_options`` input — keeps the dispatch UI usable.

on:
  workflow_dispatch:
    inputs:
      benchmark:
        description: "Full path to benchmark directory (e.g. 'levi/examples/circle_packing')"
        required: true
        type: string
        default: "levi/examples/circle_packing"
      evaluations:
        description: "Max evaluations (blank = no cap)"
        required: false
        type: string
        default: ""
      dollars:
        description: "Max USD spend (blank to disable)"
        required: false
        type: string
        default: ""
      seconds:
        description: "Wall-clock cap in seconds (blank to disable)"
        required: false
        type: string
        default: "10800"
      mutation_model:
        description: "OpenRouter id of the small / mutation model"
        required: true
        type: string
        default: "openrouter/qwen/qwen3-30b-a3b-instruct-2507"
      paradigm_model:
        description: "OpenRouter id of the frontier (paradigm-shift) model"
        required: true
        type: string
        default: "openrouter/openai/gpt-5"
      workers:
        description: "Concurrent LLM workers"
        required: false
        type: string
        default: "4"
      pe_interval:
        description: "Paradigm-shift cadence (every N evaluations)"
        required: false
        type: string
        default: "10"
      eval_timeout:
        description: "Per-candidate evaluation timeout in seconds"
        required: false
        type: string
        default: "600"
      n_diverse_seeds:
        description: "Phase-1 diverse seeds from the frontier model (sequential)"
        required: false
        type: string
        default: "5"
      n_variants_per_seed:
        description: "Phase-2 mutation-model variants per seed (parallel)"
        required: false
        type: string
        default: "20"
      ablation:
        description: >-
          Ablation mode for the paper-facing knobs. One of:
            "full"                — every component ON (DEFAULT)
            "ast_only"            — disable the description-embedding half of the behavior signature (A2)
            "emb_only"            — disable the AST half (A1)
            "static_cells"        — disable adaptive KMeans re-clustering (A3)
            "no_meta_advice"      — disable the 4-bucket lessons-learnt advisor entirely (A4)
            "meta_errors_only"    — keep the advisor, but feed only failure messages (no success-side signal) (A5)
            "no_targeted_mutate"  — disable LLM-generated parent analysis + TARGETED_MUTATE_PROMPT (A6)
            "no_crossover"        — drop crossover, run mutate-only (sets p_crossover=0) (A7)
            "no_paradigm"         — disable the frontier paradigm-shift loop (sets pe_interval=0) (A8)
        required: false
        type: choice
        default: "full"
        options:
          - full
          - ast_only
          - emb_only
          - static_cells
          - no_meta_advice
          - meta_errors_only
          - no_targeted_mutate
          - no_crossover
          - no_paradigm
      advanced_options:
        description: >-
          Optional JSON object with low-level overrides. Recognised keys:
          problem_module, target_score, embedding_model, eval_processes,
          n_paradigm_variants, paradigm_n_anchors, paradigm_n_inspirations,
          n_cells, recluster_every, embedding_dim,
          meta_advice_disabled, meta_advice_interval,
          meta_advice_mode (rich|errors_only), meta_advice_inject_p,
          targeted_mutate_disabled, analyzer_interval, analyzer_top_k,
          p_targeted_mutate, p_crossover,
          paradigm_synthesis_max_stagnation,
          paradigm_surgical_max_stagnation,
          paradigm_synthesis_n_anchors, paradigm_shift_n_anchors,
          paradigm_surgical_n_inspirations.
          Example: '{"n_cells":50,"p_targeted_mutate":0.5,"meta_advice_inject_p":0.35}'
        required: false
        type: string
        default: ""


  workflow_call:
    inputs:
      benchmark:
        required: true
        type: string
      evaluations:
        required: false
        type: string
        default: ""
      dollars:
        required: false
        type: string
        default: ""
      seconds:
        required: false
        type: string
        default: "10800"
      mutation_model:
        required: true
        type: string
        default: "openrouter/qwen/qwen3-30b-a3b-instruct-2507"
      paradigm_model:
        required: true
        type: string
        default: "openrouter/openai/gpt-5"
      workers:
        required: false
        type: string
        default: "4"
      pe_interval:
        required: false
        type: string
        default: "10"
      eval_timeout:
        required: false
        type: string
        default: "600"
      n_diverse_seeds:
        required: false
        type: string
        default: "5"
      n_variants_per_seed:
        required: false
        type: string
        default: "20"
      ablation:
        required: false
        type: string
        default: "full"
      advanced_options:
        required: false
        type: string
        default: ""


concurrency:
  group: blade-${{ github.run_id }}-${{ inputs.benchmark }}
  cancel-in-progress: false

jobs:
  blade:
    runs-on: ubuntu-latest
    env:
      OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
      OPENAI_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
      OPENAI_API_BASE: https://openrouter.ai/api/v1
      OPENAI_BASE_URL: https://openrouter.ai/api/v1
      PYTHONUNBUFFERED: "1"
      OUTPUT_DIR: outputs/github-actions/blade_${{ github.run_id }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Sanitise benchmark path for artifact name
        run: |
          # GitHub Actions does not have a `replace()` expression function,
          # so we precompute the artifact-safe variant of inputs.benchmark
          # (which may contain '/') here and consume it via env.
          SAFE="${BENCHMARK_RAW//\//_}"
          echo "BENCHMARK_SAFE=$SAFE" >> "$GITHUB_ENV"
        env:
          BENCHMARK_RAW: ${{ inputs.benchmark }}

      - name: Verify in-tree LEVI + BLADE modules
        run: |
          test -f levi/pyproject.toml || { echo "::error::Expected ./levi/pyproject.toml"; exit 1; }
          test -d levi/levi/blade   || { echo "::error::Expected ./levi/levi/blade/ (BLADE orchestrator)"; exit 1; }
          test -d levi/levi/simple  || { echo "::error::Expected ./levi/levi/simple/ (BLADE Lite primitives)"; exit 1; }
          test -f scripts/run_blade.py || { echo "::error::Expected ./scripts/run_blade.py"; exit 1; }

      - name: Set up uv
        uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.12"
          enable-cache: true

      - name: Validate OpenRouter secret
        run: |
          if [ -z "$OPENROUTER_API_KEY" ]; then
            echo "::error::Missing GitHub secret OPENROUTER_API_KEY"
            exit 1
          fi

      - name: Install LEVI (vendored in-repo)
        working-directory: levi
        run: |
          # Core deps always; per-example extras are optional and NOT pulled
          # by a bare `uv sync`. Map the selected benchmark to the extra that
          # provides its heavy dependencies (torch, networkx+pandas, ...) so
          # examples like ADRS/eplb and ADRS/cloudcast import cleanly on CI.
          EXTRA=""
          case "$BENCHMARK_RAW" in
            *eplb*)     EXTRA="--extra example-eplb" ;;       # torch
            *cloudcast*) EXTRA="--extra example-cloudcast" ;; # networkx + pandas
            *llm_sql*)  EXTRA="--extra example-llm-sql" ;;    # pandas
            *ifbench*)  EXTRA="--extra example-ifbench" ;;
            *hover*)    EXTRA="--extra example-hover" ;;
            *)          EXTRA="" ;;                            # prism, txn_scheduling, etc. need only core deps
          esac
          echo "Installing LEVI with extras: ${EXTRA:-<none>}"
          uv sync $EXTRA
          # Persist the extra so the Run step's `uv run` syncs the SAME
          # environment. Without this, `uv run` re-resolves to base deps only
          # and drops the example extras (e.g. networkx), breaking imports.
          echo "BENCHMARK_EXTRA=$EXTRA" >> "$GITHUB_ENV"
        env:
          BENCHMARK_RAW: ${{ inputs.benchmark }}

      - name: Parse advanced options
        if: inputs.advanced_options != ''
        run: |
          echo "${{ inputs.advanced_options }}" | python3 -c "
          import json, sys
          try:
              opts = json.loads(sys.stdin.read())
              for k, v in opts.items():
                  env_name = f'ADV_{k.upper()}'
                  print(f'{env_name}={v}')
          except Exception as e:
              print(f'Error parsing advanced options: {e}', file=sys.stderr)
              sys.exit(1)
          " >> $GITHUB_ENV

      - name: Download benchmark dataset
        run: |
          # ADRS examples eplb and llm_sql keep their datasets out of git
          # (gitignored) and fetch them on demand via a download_dataset.sh next
          # to the evaluator; download it here for whichever benchmark needs it.
          # cloudcast is intentionally absent: its dataset is bundled in-tree
          # under levi/examples/ADRS/cloudcast/ (committed), so it self-contains
          # and needs no download. Examples with no script are a no-op.
          DATASET_NAME=""
          case "$BENCHMARK_RAW" in
            *eplb*)      DATASET_NAME="eplb" ;;
            *llm_sql*)   DATASET_NAME="llm_sql" ;;
            *)           DATASET_NAME="" ;;
          esac
          if [ -z "$DATASET_NAME" ]; then
            echo "No dataset download required for $BENCHMARK_RAW"
            exit 0
          fi
          SCRIPT="benchmarks/ADRS/$DATASET_NAME/evaluator/download_dataset.sh"
          if [ ! -f "$SCRIPT" ]; then
            echo "::error::Expected dataset script $SCRIPT (needed by $DATASET_NAME)"
            exit 1
          fi
          echo "Downloading $DATASET_NAME dataset via $SCRIPT"
          bash "$SCRIPT"
        env:
          BENCHMARK_RAW: ${{ inputs.benchmark }}

      - name: Run BLADE on ${{ inputs.benchmark }}
        working-directory: levi
        run: |
          PROBLEM_MODULE="${ADV_PROBLEM_MODULE:-problem}"
          EMBEDDING_MODEL="${ADV_EMBEDDING_MODEL:-openrouter/openai/text-embedding-3-small}"
          EVAL_PROCESSES="${ADV_EVAL_PROCESSES:-4}"

          EXTRA_OPTS=""
          [ -n "$ADV_TARGET_SCORE" ]    && EXTRA_OPTS="$EXTRA_OPTS --target-score $ADV_TARGET_SCORE"
          [ -n "$ADV_N_PARADIGM_VARIANTS" ] && EXTRA_OPTS="$EXTRA_OPTS --n-paradigm-variants $ADV_N_PARADIGM_VARIANTS"
          [ -n "$ADV_PARADIGM_N_ANCHORS" ] && EXTRA_OPTS="$EXTRA_OPTS --paradigm-n-anchors $ADV_PARADIGM_N_ANCHORS"
          [ -n "$ADV_PARADIGM_N_INSPIRATIONS" ] && EXTRA_OPTS="$EXTRA_OPTS --paradigm-n-inspirations $ADV_PARADIGM_N_INSPIRATIONS"
          [ -n "$ADV_N_CELLS" ]         && EXTRA_OPTS="$EXTRA_OPTS --n-cells $ADV_N_CELLS"
          [ -n "$ADV_RECLUSTER_EVERY" ] && EXTRA_OPTS="$EXTRA_OPTS --recluster-every $ADV_RECLUSTER_EVERY"
          [ -n "$ADV_EMBEDDING_DIM" ]   && EXTRA_OPTS="$EXTRA_OPTS --embedding-dim $ADV_EMBEDDING_DIM"
          [ -n "$ADV_META_ADVICE_INTERVAL" ] && EXTRA_OPTS="$EXTRA_OPTS --meta-advice-interval $ADV_META_ADVICE_INTERVAL"
          [ -n "$ADV_META_ADVICE_INJECT_P" ] && EXTRA_OPTS="$EXTRA_OPTS --meta-advice-inject-p $ADV_META_ADVICE_INJECT_P"
          [ "$ADV_META_ADVICE_DISABLED" = "true" ] && EXTRA_OPTS="$EXTRA_OPTS --no-meta-advice"
          [ "$ADV_TARGETED_MUTATE_DISABLED" = "true" ] && EXTRA_OPTS="$EXTRA_OPTS --no-targeted-mutate"
          [ -n "$ADV_ANALYZER_INTERVAL" ] && EXTRA_OPTS="$EXTRA_OPTS --analyzer-interval $ADV_ANALYZER_INTERVAL"
          [ -n "$ADV_ANALYZER_TOP_K" ] && EXTRA_OPTS="$EXTRA_OPTS --analyzer-top-k $ADV_ANALYZER_TOP_K"
          [ -n "$ADV_P_TARGETED_MUTATE" ] && EXTRA_OPTS="$EXTRA_OPTS --p-targeted-mutate $ADV_P_TARGETED_MUTATE"
          [ -n "$ADV_P_CROSSOVER" ] && EXTRA_OPTS="$EXTRA_OPTS --p-crossover $ADV_P_CROSSOVER"
          [ -n "$ADV_META_ADVICE_MODE" ] && EXTRA_OPTS="$EXTRA_OPTS --meta-advice-mode $ADV_META_ADVICE_MODE"
          [ -n "$ADV_PARADIGM_SYNTHESIS_MAX_STAGNATION" ] && EXTRA_OPTS="$EXTRA_OPTS --paradigm-synthesis-max-stagnation $ADV_PARADIGM_SYNTHESIS_MAX_STAGNATION"
          [ -n "$ADV_PARADIGM_SURGICAL_MAX_STAGNATION" ] && EXTRA_OPTS="$EXTRA_OPTS --paradigm-surgical-max-stagnation $ADV_PARADIGM_SURGICAL_MAX_STAGNATION"
          [ -n "$ADV_PARADIGM_SYNTHESIS_N_ANCHORS" ] && EXTRA_OPTS="$EXTRA_OPTS --paradigm-synthesis-n-anchors $ADV_PARADIGM_SYNTHESIS_N_ANCHORS"
          [ -n "$ADV_PARADIGM_SHIFT_N_ANCHORS" ] && EXTRA_OPTS="$EXTRA_OPTS --paradigm-shift-n-anchors $ADV_PARADIGM_SHIFT_N_ANCHORS"
          [ -n "$ADV_PARADIGM_SURGICAL_N_INSPIRATIONS" ] && EXTRA_OPTS="$EXTRA_OPTS --paradigm-surgical-n-inspirations $ADV_PARADIGM_SURGICAL_N_INSPIRATIONS"

          # Paper-facing ablation toggles. ``pe_interval`` is set to the
          # workflow input by default but the ``no_paradigm`` ablation
          # overrides it to 0 (which disables the PE monitor inside the
          # orchestrator). The operator-side ablations append the
          # matching CLI flag.
          PE_INTERVAL_EFFECTIVE="${{ inputs.pe_interval }}"
          case "${{ inputs.ablation }}" in
            ast_only)            EXTRA_OPTS="$EXTRA_OPTS --ast-only" ;;
            emb_only)            EXTRA_OPTS="$EXTRA_OPTS --emb-only" ;;
            static_cells)        EXTRA_OPTS="$EXTRA_OPTS --static-cells" ;;
            no_meta_advice)      EXTRA_OPTS="$EXTRA_OPTS --no-meta-advice" ;;
            meta_errors_only)    EXTRA_OPTS="$EXTRA_OPTS --meta-advice-mode errors_only" ;;
            no_targeted_mutate)  EXTRA_OPTS="$EXTRA_OPTS --no-targeted-mutate" ;;
            no_crossover)        EXTRA_OPTS="$EXTRA_OPTS --no-crossover" ;;
            no_paradigm)         PE_INTERVAL_EFFECTIVE="0" ;;
            full|*)              ;;
          esac

          uv run --active $BENCHMARK_EXTRA python ../scripts/run_blade.py \
            --example-dir "${{ inputs.benchmark }}" \
            --problem-module "$PROBLEM_MODULE" \
            --mutation-model "${{ inputs.mutation_model }}" \
            --paradigm-model "${{ inputs.paradigm_model }}" \
            --embedding-model "$EMBEDDING_MODEL" \
            --evals "${{ inputs.evaluations }}" \
            --dollars "${{ inputs.dollars }}" \
            --seconds "${{ inputs.seconds }}" \
            --workers "${{ inputs.workers }}" \
            --eval-processes "$EVAL_PROCESSES" \
            --eval-timeout "${{ inputs.eval_timeout }}" \
            --pe-interval "$PE_INTERVAL_EFFECTIVE" \
            --n-diverse-seeds "${{ inputs.n_diverse_seeds }}" \
            --n-variants-per-seed "${{ inputs.n_variants_per_seed }}" \
            --output-dir "${{ env.OUTPUT_DIR }}" \
            $EXTRA_OPTS

      - name: Upload run artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: blade-${{ env.BENCHMARK_SAFE }}-${{ inputs.ablation }}-${{ github.run_id }}
          path: ${{ env.OUTPUT_DIR }}
          if-no-files-found: warn
          retention-days: 14
