name: Baselines Smoke
run-name: Baselines Smoke — ${{ inputs.baseline }} · ${{ inputs.benchmark_dir }} · ${{ inputs.model }} · seed ${{ inputs.seed }}

# Run a single baseline (openevolve_native | gepa_native | adaevolve | evox)
# on any benchmark directory under ./benchmarks/. The job is hard-capped at
# 3 hours by `timeout-minutes`; per-baseline budgets live in the benchmark's
# own config.yaml.
#
# Per-LLM-call OpenRouter usage.cost is appended to cost_log.jsonl with a
# running cost_log.totals.json (skydiscover.llm.cost_tracker).
#
# The `dollars` input is the money-side counterpart of that 3-hour cap, and
# the analogue of blade.yml's `dollars`: the run stops itself once the
# tracked spend reaches the cap, instead of running `iterations` to the end.

on:
  workflow_dispatch:
    inputs:
      baseline:
        description: "Which baseline to run"
        required: true
        type: choice
        default: "evox"
        options:
          - openevolve_native
          - gepa_native
          - adaevolve
          - evox
      benchmark_dir:
        description: "Benchmark directory (must contain initial_program.py, config.yaml, and either evaluator.py or evaluator/evaluator.py). CO-Bench problems live under benchmarks/co_bench/<slug> (e.g. benchmarks/co_bench/tsp, benchmarks/co_bench/bin_packing_1d)."
        required: false
        default: "benchmarks/math/circle_packing"
      iterations:
        description: "Number of iterations to run"
        required: false
        default: "100"
      dollars:
        description: "Max USD spend — the run stops gracefully at the next iteration boundary once tracked LLM cost reaches it (blank or 0 = no cap). Soft cap: in-flight calls still finish, so the total can overshoot by roughly one iteration."
        required: false
        default: ""
      model:
        description: "OpenRouter model id routed through SkyDiscover"
        required: false
        default: "openrouter/openai/gpt-5"
      cobench_timeout:
        description: "CO-Bench only: per-instance time limit in seconds (paper uses 10). Ignored by non-CO-Bench benchmarks."
        required: false
        default: "10"
      cobench_max_cases:
        description: "CO-Bench only: max test-case files per evaluation (default: all files; set a positive N to use fewer for a quicker run)."
        required: false
        default: ""
      cobench_max_instances:
        description: "CO-Bench only: max instances per test-case file (default 3; set 0 for all instances = full test set)."
        required: false
        default: ""
      seed:
        description: "Experiment seed label (e.g. 1, 2, 3) — tags the run name and artifacts only; does not change execution"
        required: false
        default: "1"


concurrency:
  group: baseline-${{ github.run_id }}-${{ inputs.baseline }}-${{ inputs.benchmark_dir }}
  cancel-in-progress: false

jobs:
  baseline:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    env:
      OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
      OPENAI_API_BASE: https://openrouter.ai/api/v1
      OPENAI_BASE_URL: https://openrouter.ai/api/v1

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up uv
        uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.12"
          enable-cache: true

      - name: Validate OpenRouter secret
        run: |
          if [ -z "$OPENROUTER_API_KEY" ]; then
            echo "Missing GitHub secret: OPENROUTER_API_KEY"
            exit 1
          fi

      - name: Validate benchmark dir & resolve evaluator
        id: resolve
        run: |
          BD="${{ inputs.benchmark_dir }}"
          # Required files at the benchmark root.
          for f in initial_program.py config.yaml; do
            if [ ! -f "$BD/$f" ]; then
              echo "::error::Expected $BD/$f to exist"
              exit 1
            fi
          done
          # Evaluator can live at either:
          #   <bench>/evaluator.py            (legacy "outer" layout, e.g. circle_packing)
          #   <bench>/evaluator/evaluator.py  (container layout, e.g. circle_packing_rect)
          # Both define `evaluate(program_path) -> dict` and run fine without Docker.
          if [ -f "$BD/evaluator.py" ]; then
            EVAL_FILE="$BD/evaluator.py"
          elif [ -f "$BD/evaluator/evaluator.py" ]; then
            EVAL_FILE="$BD/evaluator/evaluator.py"
          else
            echo "::error::Could not find an evaluator at $BD/evaluator.py or $BD/evaluator/evaluator.py"
            exit 1
          fi
          echo "Using evaluator: $EVAL_FILE"
          echo "eval_file=$EVAL_FILE" >> "$GITHUB_OUTPUT"

      - name: Install dependencies
        run: |
          uv sync
          uv run python scripts/install_benchmark_requirements.py \
            "${{ inputs.benchmark_dir }}"

      - name: Download benchmark datasets
        run: |
          # Some benchmarks (e.g. ADRS cloudcast / llm_sql / eplb) keep their
          # data out of git and ship a download_dataset.sh that fetches it next
          # to the evaluator. Run every such script found under the benchmark
          # dir; benchmarks that generate their data in-process have none and
          # are skipped.
          BD="${{ inputs.benchmark_dir }}"
          found=0
          while IFS= read -r script; do
            found=1
            echo "Running dataset download: $script"
            bash "$script"
          done < <(find "$BD" -name download_dataset.sh -type f | sort)
          if [ "$found" -eq 0 ]; then
            echo "No download_dataset.sh found under $BD — assuming self-contained data."
          fi

      - name: Run ${{ inputs.baseline }} on ${{ inputs.benchmark_dir }}
        env:
          OPENAI_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          # Per-call OpenRouter usage.cost is appended here by skydiscover.llm.cost_tracker.
          # A running aggregate is rewritten at cost_log.totals.json on every call.
          SKYDISCOVER_COST_LOG: outputs/github-actions/baseline_${{ inputs.baseline }}_${{ github.run_id }}/cost_log.jsonl
          # CO-Bench knobs (read by benchmarks/co_bench/*/evaluator.py; harmless for other benchmarks).
          COBENCH_TIMEOUT: ${{ inputs.cobench_timeout }}
          COBENCH_MAX_CASES: ${{ inputs.cobench_max_cases }}
          COBENCH_MAX_INSTANCES: ${{ inputs.cobench_max_instances }}
        run: |
          mkdir -p "outputs/github-actions/baseline_${{ inputs.baseline }}_${{ github.run_id }}"
          uv run skydiscover-run "${{ inputs.benchmark_dir }}/initial_program.py" \
            "${{ steps.resolve.outputs.eval_file }}" \
            --config "${{ inputs.benchmark_dir }}/config.yaml" \
            --search "${{ inputs.baseline }}" \
            --model "${{ inputs.model }}" \
            --iterations "${{ inputs.iterations }}" \
            --dollars "${{ inputs.dollars }}" \
            --output "outputs/github-actions/baseline_${{ inputs.baseline }}_${{ github.run_id }}/run"

      - name: Cost summary
        if: always()
        run: |
          OUT_DIR="outputs/github-actions/baseline_${{ inputs.baseline }}_${{ github.run_id }}"
          TOTALS="$OUT_DIR/cost_log.totals.json"
          LOG="$OUT_DIR/cost_log.jsonl"
          echo "## ${{ inputs.baseline }} on ${{ inputs.benchmark_dir }}" >> $GITHUB_STEP_SUMMARY
          if [ -n "${{ inputs.dollars }}" ]; then
            echo "Spend budget: \$${{ inputs.dollars }}" >> $GITHUB_STEP_SUMMARY
          fi
          if [ -f "$TOTALS" ]; then
            echo '```json' >> $GITHUB_STEP_SUMMARY
            cat "$TOTALS" >> $GITHUB_STEP_SUMMARY
            echo '' >> $GITHUB_STEP_SUMMARY
            echo '```' >> $GITHUB_STEP_SUMMARY
            echo "Cost totals:"
            cat "$TOTALS"
          else
            echo "_No cost log produced._" >> $GITHUB_STEP_SUMMARY
          fi
          if [ -f "$LOG" ]; then
            echo ""
            echo "LLM calls recorded: $(wc -l < "$LOG" | tr -d ' ')"
          fi

      - name: Upload run outputs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: baseline-${{ inputs.baseline }}-seed${{ inputs.seed }}-${{ github.run_id }}
          path: outputs/github-actions/
          if-no-files-found: warn
